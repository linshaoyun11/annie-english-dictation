# Codemagic CI 配置 —— 无 Mac 云端打包 iOS
# 使用方法见 docs/capacitor-ios-setup.md 「方案 B：无 Mac 云端发布」
# 前置条件：
#   1. 项目已推送到 GitHub/GitLab/Bitbucket 仓库（含 public/audio 音频资源）
#   2. 在 App Store Connect → 用户和访问 → 集成 中创建了 API 密钥
#   3. 在 Codemagic → Teams/Personal settings → Integrations → App Store Connect API keys
#      中添加了该密钥，名称必须与下方 integrations.app_store_connect 完全一致
#   4. Codemagic 已关联本仓库，并识别到本文件
workflows:
  ios-release:
    name: 安妮英语听写 iOS 发布
    instance_type: mac_mini_m2
    max_build_duration: 60
    # 引用 Codemagic 网页端创建的 App Store Connect API 集成
    # 集成名称必须与网页端添加时填写的名称完全一致
    integrations:
      app_store_connect: annie-english-dictation
    environment:
      node: 22
      # code-signing 变量组：在 Codemagic 网页端 App 设置 → Environment variables
      # 中创建，包含 CERTIFICATE_PRIVATE_KEY（iOS 发布证书私钥，Secure 加密存储）
      groups:
        - code-signing
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        APP_VERSION: 1.0.0
        APP_BUILD: 1
        BUNDLE_ID: com.annie.dictation
    scripts:
      - name: 安装依赖
        script: npm ci

      - name: 构建 Web 资源
        script: npm run build

      # ios/ 已加入 .gitignore，由 CI 现场生成，
      # 避免在 Windows 上执行 cap sync ios 产生跨平台路径问题
      # @capacitor/ios 仅云端生成原生工程时需要，--no-save 不改动 lock 文件
      - name: 生成并同步 iOS 原生工程
        script: |
          npm install @capacitor/ios@8.5.0 --no-save --no-audit --no-fund --loglevel=error
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: 配置 App 图标（1024 单尺寸）
        script: |
          ICON_DIR=ios/App/App/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$ICON_DIR"
          cp assets/app-icon-1024.png "$ICON_DIR/AppIcon-1024.png"
          cat > "$ICON_DIR/Contents.json" <<'EOF'
          {
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

      - name: 设置版本号与竖屏方向
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $APP_BUILD" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"

      # 显式自动签名：找不到描述文件时会自动创建（--create）
      - name: 初始化签名钥匙串
        script: keychain initialize

      - name: 获取/创建签名文件
        script: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "=== 诊断信息 ==="
            echo "未读取到 CERTIFICATE_PRIVATE_KEY 环境变量！"
            echo "请到 Codemagic 网页端确认："
            echo "1. 变量名必须为 CERTIFICATE_PRIVATE_KEY（全大写、下划线）"
            echo "2. 变量的 Group 必须为 code-signing"
            echo "3. 值为完整 PEM 私钥（含 BEGIN/END 行）"
            exit 1
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: 添加签名证书到钥匙串
        script: keychain add-certificates

      - name: 应用签名描述文件到 Xcode 工程
        script: xcode-project use-profiles

      - name: 打包 IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        # 直接使用 Codemagic 为 App Store Connect 集成注入的环境变量
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
