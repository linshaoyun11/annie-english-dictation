# Codemagic CI 配置 —— 无 Mac 云端打包 iOS
# 使用方法见 docs/capacitor-ios-setup.md 「方案 B：无 Mac 云端发布」
# 前置条件：
#   1. 项目已推送到 GitHub/GitLab/Bitbucket 仓库（含 public/audio 音频资源）
#   2. 在 App Store Connect → 用户和访问 → 集成 中创建了 API 密钥
#   3. 在 Codemagic → Teams/Personal settings → Integrations → App Store Connect API keys
#      中添加了该密钥，名称必须与下方 integrations.app_store_connect 完全一致
#   4. Codemagic 已关联本仓库，并识别到本文件
workflows:
  ios-release:
    name: 安妮英语听写 iOS 发布
    instance_type: mac_mini_m2
    max_build_duration: 60
    # 引用 Codemagic 网页端创建的 App Store Connect API 集成
    # 集成名称必须与网页端添加时填写的名称完全一致
    integrations:
      app_store_connect: annie-english-dictation
    environment:
      node: 22
      # code-signing 变量组：在 Codemagic 网页端 App 设置 → Environment variables
      # 中创建，包含 CERTIFICATE_PRIVATE_KEY（iOS 发布证书私钥，Secure 加密存储）
      groups:
        - code-signing
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        APP_VERSION: 1.0.0
        APP_BUILD: 29
        BUNDLE_ID: com.annie.dictation
    scripts:
      - name: 安装依赖
        script: npm ci

      - name: 构建 Web 资源
        script: npm run build

      # ios/ 已加入 .gitignore，由 CI 现场生成，
      # 避免在 Windows 上执行 cap sync ios 产生跨平台路径问题
      # @capacitor/ios 仅云端生成原生工程时需要，--no-save 不改动 lock 文件
      # 注意：Capacitor 8 默认用 SPM 模板（无 xcworkspace），必须指定
      # CocoaPods 模板才能生成下方 XCODE_WORKSPACE 指向的 App.xcworkspace
      - name: 生成并同步 iOS 原生工程
        script: |
          npm install @capacitor/ios@8.5.0 --no-save --no-audit --no-fund --loglevel=error
          if [ ! -d ios ]; then
            npx cap add ios --packagemanager CocoaPods
          fi
          npx cap sync ios
          echo "--- iOS 工程结构 ---"
          ls ios/App/

      - name: 配置 App 图标（1024 单尺寸）
        script: |
          ICON_DIR=ios/App/App/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$ICON_DIR"
          cp assets/app-icon-1024.png "$ICON_DIR/AppIcon-1024.png"
          cat > "$ICON_DIR/Contents.json" <<'EOF'
          {
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

      - name: 设置版本号、竖屏方向与状态栏
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $APP_BUILD" "$PLIST"
          # 出口合规声明：App 不含加密/仅使用系统 HTTPS，
          # 免去每次 TestFlight 提审前在网页手动回答合规问题
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          # 状态栏：App 底色浅，需要深色文字；让 Info.plist 全局控制
          /usr/libexec/PlistBuddy -c "Delete :UIViewControllerBasedStatusBarAppearance" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIStatusBarStyle" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarStyle string UIStatusBarStyleDarkContent" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"

      # Capacitor 默认生成的 Main.storyboard 把 WebView 约束到安全区，
      # 导致刘海/灵动岛机型出现上下黑边。这里把 WebView 上下左右都改为约束到父视图，
      # 配合 viewport-fit=cover 实现真正的全屏。
      - name: 修复 iOS 全屏黑边（Storyboard 约束）
        script: |
          python3 - <<'PYEOF'
          import re, pathlib
          sb = pathlib.Path('ios/App/App/Base.lproj/Main.storyboard')
          if not sb.exists():
              print('Main.storyboard not found, skip')
              raise SystemExit(0)
          text = sb.read_text(encoding='utf-8')
          # 取出根 view id、safeAreaLayoutGuide id、wkWebView id
          view_id = re.search(r'<view key="view"[^>]*?\bid="([^"]+)"', text)
          safe_id = re.search(r'<viewLayoutGuide key="safeArea"[^>]*?\bid="([^"]+)"', text)
          wv_id = re.search(r'<wkWebView[^>]*?\bid="([^"]+)"', text)
          if not (view_id and safe_id and wv_id):
              print('Could not find required ids, skip')
              print('view_id', bool(view_id), 'safe_id', bool(safe_id), 'wv_id', bool(wv_id))
              raise SystemExit(0)
          view_id, safe_id, wv_id = view_id.group(1), safe_id.group(1), wv_id.group(1)
          print(f'view={view_id} safe={safe_id} webview={wv_id}')
          # 只替换 firstItem=webview 且 secondItem=safeArea 的约束
          def repl(m):
              pre = m.group(1)
              attr = m.group(2)
              post = m.group(3)
              return f'{pre}"{view_id}" secondAttribute="{attr}"{post}'
          pattern = re.compile(
              r'(constraint firstItem="' + wv_id + r'" firstAttribute="(\w+)" secondItem=")' + safe_id + r'" secondAttribute="\2"([^>]*)'
          )
          new_text, n = pattern.subn(repl, text)
          if n:
              sb.write_text(new_text, encoding='utf-8')
              print(f'Patched {n} constraints')
          else:
              print('No webview-to-safearea constraints found')
          PYEOF

      # 修复 WKWebView 音频会话两个问题：
      # 1) 首次播放音量偏小：会话在首次 play() 时才异步激活，增益爬升。
      #    启动时即设为 playback 并激活，全程满增益。
      # 2) 后台挂起/来电打断后完全无声（重启才恢复）：系统会停用会话，
      #    之后 WKWebView 里所有 play() 正常返回但无声。
      #    监听打断结束通知 + 回前台回调里重新激活会话。
      - name: 修复音频会话（首次音量小 + 后台回来无声，激活一律走后台线程）
        script: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path('ios/App/App/AppDelegate.swift')
          if not p.exists():
              print('AppDelegate.swift not found, skip')
              raise SystemExit(0)
          t = p.read_text(encoding='utf-8')
          if 'AVAudioSession' in t:
              print('already patched')
              raise SystemExit(0)
          if 'import AVFoundation' not in t:
              t = t.replace('import UIKit', 'import UIKit\nimport AVFoundation', 1)
          marker = '// Override point for customization after application launch.'
          code = (
              '// 音频会话：此处只设置类别（非阻塞、安全）。\n'
              '        // 修复首次播放音量偏小：playback 类别提前就位，播放全程满增益。\n'
              '        // 注意：setActive(true) 是同步阻塞调用（等待音频服务器/路由就绪），\n'
              '        // 绝不能在主线程执行——否则启动时卡住主线程，学习页卡顿、\n'
              '        // 按钮无响应、首个 play() 被卡住只剩尾音。统一转后台队列激活。\n'
              '        try? AVAudioSession.sharedInstance().setCategory(.playback)\n'
              '        // 启动即预热激活（后台队列异步，不挡主线程）\n'
              '        self.activateAudioSession()\n'
              '        // 后台挂起/来电等打断后系统会停用音频会话，之后\n'
              '        // WKWebView 里所有 play() 都正常返回但完全无声。\n'
              '        // 监听打断结束通知，立即重新激活会话（同样走后台队列）。\n'
              '        NotificationCenter.default.addObserver(\n'
              '            forName: AVAudioSession.interruptionNotification,\n'
              '            object: nil,\n'
              '            queue: .main\n'
              '        ) { note in\n'
              '            // 仅在打断结束时重新激活会话；打断进行中激活会引发异常行为\n'
              '            let type = (note.userInfo?[AVAudioSessionInterruptionTypeKey] as? UInt) ?? 0\n'
              '            if type == AVAudioSession.InterruptionType.ended.rawValue {\n'
              '                self.activateAudioSession()\n'
              '            }\n'
              '        }\n'
              '        '
          )
          if marker in t:
              t = t.replace(marker, code + marker, 1)
          else:
              t = t.replace(
                  'didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {',
                  'didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {\n        ' + code.rstrip(),
                  1,
              )
          # 后台队列激活的辅助方法（插到类结尾）
          helper = (
              '\n    // 后台队列激活音频会话：setActive 是同步阻塞调用（等音频服务器/路由就绪），\n'
              '    // 在主线程调用会卡住整个 App（启动卡顿、页面无响应、首播卡死只剩尾音的元凶），\n'
              '    // 所有激活入口统一从这里转后台队列执行。\n'
              '    func activateAudioSession() {\n'
              '        DispatchQueue.global(qos: .userInitiated).async {\n'
              '            try? AVAudioSession.sharedInstance().setActive(true)\n'
              '        }\n'
              '    }\n'
          )
          idx = t.rstrip().rfind('}')
          if idx > 0:
              t = t[:idx] + helper + t[idx:]
          # 回前台兜底重新激活（覆盖打断通知未发出的场景，如直接挂起）。
          # 注意：Capacitor 模板本身已含 applicationDidBecomeActive（空实现），
          # 必须往现有方法体里注入，不能靠"不存在才新增"的判断（旧补丁因此漏注）。
          become_marker = 'func applicationDidBecomeActive(_ application: UIApplication) {'
          if become_marker in t:
              head, rest = t.split(become_marker, 1)
              if 'activateAudioSession()' not in rest[:600]:
                  inject = (
                      '\n        // 回前台重新激活音频会话（后台队列）：后台挂起后系统可能已停用，\n'
                      '        // 不重新激活则学习页所有音频完全无声\n'
                      '        activateAudioSession()\n'
                  )
                  t = head + become_marker + inject + rest
          else:
              method = (
                  '\n    func applicationDidBecomeActive(_ application: UIApplication) {\n'
                  '        // 回前台重新激活音频会话（后台队列）：后台挂起后系统可能已停用，\n'
                  '        // 不重新激活则学习页所有音频完全无声\n'
                  '        activateAudioSession()\n'
                  '    }\n'
              )
              idx = t.rstrip().rfind('}')
              if idx > 0:
                  t = t[:idx] + method + t[idx:]
          p.write_text(t, encoding='utf-8')
          print('Patched AppDelegate.swift: category on main, activation on background queue')
          PYEOF

      # 显式自动签名：找不到描述文件时会自动创建（--create）
      - name: 初始化签名钥匙串
        script: keychain initialize

      - name: 获取/创建签名文件
        script: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "=== 诊断信息 ==="
            echo "未读取到 CERTIFICATE_PRIVATE_KEY 环境变量！"
            echo "请到 Codemagic 网页端确认："
            echo "1. 变量名必须为 CERTIFICATE_PRIVATE_KEY（全大写、下划线）"
            echo "2. 变量的 Group 必须为 code-signing"
            echo "3. 值为完整 PEM 私钥（含 BEGIN/END 行）"
            exit 1
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: 添加签名证书到钥匙串
        script: keychain add-certificates

      - name: 应用签名描述文件到 Xcode 工程
        script: xcode-project use-profiles

      - name: 打包 IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        # 复用 workflow 级 integrations.app_store_connect 引用的 API 密钥
        # 注意：integration 模式下不要用 $APP_STORE_CONNECT_PRIVATE_KEY 变量，
        # 该变量不会注入，传给 CLI 的是字面量导致 "not a valid PEM" 报错
        auth: integration
        submit_to_testflight: true
